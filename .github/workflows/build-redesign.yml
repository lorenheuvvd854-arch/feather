name: Build redesigned IPA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-redesign.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply prepared source changes

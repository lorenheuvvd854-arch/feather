          +// Semantic system colors preserve the user's appearance and accent settings.
          +struct FRCardStyle: ViewModifier {
          +	@Environment(\.colorSchemeContrast) private var contrast
          +
          +	func body(content: Content) -> some View {
          +		content
          +			.background(Color(uiColor: .secondarySystemGroupedBackground))
          +			.clipShape(RoundedRectangle(cornerRadius: 22, style: .continuous))
          +			.overlay {
          +				RoundedRectangle(cornerRadius: 22, style: .continuous)
          +					.strokeBorder(Color.primary.opacity(contrast == .increased ? 0.35 : 0.08))
          +			}
          +	}
          +}
          +
          +struct FRDashboardView: View {
          +	let title: String
          +	let subtitle: String
          +	let symbol: String
          +	let statistics: [(title: String, value: Int)]
          +
          +	var body: some View {
          +		VStack(alignment: .leading, spacing: 20) {
          +			Image(systemName: symbol)
          +				.font(.title2.weight(.semibold))
          +				.foregroundStyle(Color.accentColor)
          +				.padding(13)
          +				.background(Color.accentColor.opacity(0.12), in: RoundedRectangle(cornerRadius: 17))
          +				.accessibilityHidden(true)
          +
          +			VStack(alignment: .leading, spacing: 6) {
          +				Text(title)
          +					.font(.system(.title, design: .rounded, weight: .bold))
          +					.foregroundStyle(.primary)
          +				Text(subtitle)
          +					.font(.subheadline)
          +					.foregroundStyle(.secondary)
          +					.fixedSize(horizontal: false, vertical: true)
          +			}
          +
          +			ViewThatFits(in: .horizontal) {
          +				HStack(alignment: .top, spacing: 24) { _statistics }
          +				VStack(alignment: .leading, spacing: 12) { _statistics }
          +			}
          +		}
          +		.frame(maxWidth: .infinity, alignment: .leading)
          +		.padding(22)
          +		.background {
          +			LinearGradient(colors: [Color.accentColor.opacity(0.09), .clear],
          +			               startPoint: .topTrailing, endPoint: .bottomLeading)
          +		}
          +		.modifier(FRCardStyle())
          +	}
          +
          +	private var _statistics: some View {
          +		ForEach(statistics.indices, id: \.self) { index in
          +			VStack(alignment: .leading, spacing: 3) {
          +				Text(statistics[index].value, format: .number)
          +					.font(.system(.title2, design: .rounded, weight: .bold))
          +					.monospacedDigit()
          +				Text(statistics[index].title)
          +					.font(.caption.weight(.medium))
          +					.foregroundStyle(.secondary)
          +			}
          +			.fixedSize()
          +			.accessibilityElement(children: .combine)
          +		}
          +	}
          +}
          +
          +struct FREmptyStateView<Action: View>: View {
          +	let title: String
          +	let message: String
          +	let symbol: String
          +	private let action: () -> Action
          +
          +	init(title: String, message: String, symbol: String, @ViewBuilder action: @escaping () -> Action) {
          +		self.title = title
          +		self.message = message
          +		self.symbol = symbol
          +		self.action = action
          +	}
          +
          +	var body: some View {
          +		VStack(spacing: 14) {
          +			Image(systemName: symbol)
          +				.font(.largeTitle)
          +				.foregroundStyle(Color.accentColor)
          +				.accessibilityHidden(true)
          +			Text(title).font(.title3.bold())
          +			Text(message)
          +				.font(.subheadline)
          +				.foregroundStyle(.secondary)
          +				.multilineTextAlignment(.center)
          +			action().buttonStyle(.borderedProminent).controlSize(.large)
          +		}
          +		.frame(maxWidth: .infinity)
          +		.padding(28)
          +		.modifier(FRCardStyle())
          +	}
          +}

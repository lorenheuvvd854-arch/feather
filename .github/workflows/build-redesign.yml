          +import SwiftUI
          +
          +// Mist surfaces adapt to appearance without overriding the user's preference.
          +enum FRMist {
          +    static let background = Color(uiColor: UIColor { traits in
          +        traits.userInterfaceStyle == .dark
          +            ? UIColor(red: 0.075, green: 0.075, blue: 0.105, alpha: 1)
          +            : UIColor(red: 0.955, green: 0.953, blue: 0.978, alpha: 1)
          +    })
          +}
          +struct FRCardStyle: ViewModifier {
          +	@Environment(\.colorSchemeContrast) private var contrast
          +
          +	func body(content: Content) -> some View {
          +		content
          +			.background(Color(uiColor: .secondarySystemGroupedBackground))
          +			.clipShape(RoundedRectangle(cornerRadius: 24, style: .continuous))
          +			.overlay {
          +				RoundedRectangle(cornerRadius: 24, style: .continuous)
          +					.strokeBorder(Color.primary.opacity(contrast == .increased ? 0.35 : 0.045))
          +			}
          +	}
          +}
          +
          +struct FREmptyStateView<Action: View>: View {
          +	let title: String
          +	let message: String
          +	let symbol: String
          +	private let action: () -> Action
          +
          +	init(title: String, message: String, symbol: String, @ViewBuilder action: @escaping () -> Action) {
          +		self.title = title
          +		self.message = message
          +		self.symbol = symbol
          +		self.action = action
          +	}
          +
          +	var body: some View {
          +		VStack(spacing: 14) {
          +			Image(systemName: symbol)
          +				.font(.largeTitle)
          +				.foregroundStyle(Color.accentColor)
          +				.accessibilityHidden(true)
          +			Text(title).font(.title3.bold())
          +			Text(message)
          +				.font(.subheadline)
          +				.foregroundStyle(.secondary)
          +				.multilineTextAlignment(.center)
          +			action().buttonStyle(.borderedProminent).controlSize(.large)
          +		}
          +		.frame(maxWidth: .infinity)
          +		.padding(28)
          +		.modifier(FRCardStyle())
          +	}
          +}

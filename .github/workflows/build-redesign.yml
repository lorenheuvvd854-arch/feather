          new file mode 100644
          index 0000000..e434998
          --- /dev/null
          +++ b/NimbleKit/Tests/NimbleJSONRegression/main.swift
          @@ -0,0 +1,152 @@
          +import Foundation
          +import XCTest
          +
          +// Compile alongside NBFetchService.swift to test only the Foundation target.
          +// Other NimbleKit products require UIKit and cannot run as macOS host tests.
          +private final class StubURLProtocol: URLProtocol {
          +	static var statusCode = 200
          +	static var body = Data()
          +	static var error: Error?
          +	static var isHTTP = true
          +
          +	override class func canInit(with request: URLRequest) -> Bool { true }
          +	override class func canonicalRequest(for request: URLRequest) -> URLRequest { request }
          +	override func stopLoading() {}
          +
          +	override func startLoading() {
          +		if let error = Self.error {
          +			client?.urlProtocol(self, didFailWithError: error)
          +			return
          +		}
          +		let response: URLResponse = Self.isHTTP
          +			? HTTPURLResponse(url: request.url!, statusCode: Self.statusCode,
          +			                  httpVersion: nil, headerFields: nil)!
          +			: URLResponse(url: request.url!, mimeType: "application/json",
          +			              expectedContentLength: Self.body.count, textEncodingName: nil)
          +		client?.urlProtocol(self, didReceive: response, cacheStoragePolicy: .notAllowed)
          +		client?.urlProtocol(self, didLoad: Self.body)
          +		client?.urlProtocolDidFinishLoading(self)
          +	}
          +}
          +
          +final class FetchServiceTests: XCTestCase {
          +	private struct Payload: Decodable { let name: String }
          +	private var session: URLSession!
          +	private var service: NBFetchService!
          +
          +	override func setUp() {
          +		super.setUp()
          +		StubURLProtocol.statusCode = 200
          +		StubURLProtocol.body = Data(#"{"name":"Feather"}"#.utf8)
          +		StubURLProtocol.error = nil
          +		StubURLProtocol.isHTTP = true
          +		let configuration = URLSessionConfiguration.ephemeral
          +		configuration.protocolClasses = [StubURLProtocol.self]
          +		session = URLSession(configuration: configuration)
          +		service = NBFetchService(session: session)
          +	}
          +
          +	override func tearDown() {
          +		session.invalidateAndCancel()
          +		service = nil
          +		session = nil
          +		super.tearDown()
          +	}
          +
          +	private func fetch(_ check: @escaping (Result<Payload, Error>) -> Void) {
          +		let completed = expectation(description: "Fetch completes exactly once")
          +		completed.assertForOverFulfill = true
          +		service.fetch(from: URL(string: "https://feather.invalid/source.json")!) {
          +			(result: Result<Payload, Error>) in
          +			check(result)
          +			completed.fulfill()
          +		}
          +		wait(for: [completed], timeout: 5)
          +	}
          +
          +	func testSuccess() {
          +		fetch { result in
          +			switch result {
          +			case .success(let payload): XCTAssertEqual(payload.name, "Feather")
          +			case .failure(let error): XCTFail("Unexpected error: \(error)")
          +			}
          +		}
          +	}
          +
          +	func testOtherSuccessfulStatus() {
          +		StubURLProtocol.statusCode = 201
          +		testSuccess()
          +	}
          +
          +	func testNonHTTPResponseStillWorks() {
          +		StubURLProtocol.isHTTP = false
          +		testSuccess()
          +	}
          +
          +	func testHTTPErrorRejectsDecodableBody() {
          +		for code in [199, 300, 401, 404, 429, 500, 503] {
          +			StubURLProtocol.statusCode = code
          +			fetch { result in
          +				guard case .failure(let error) = result,
          +				      case NBFetchService.NBFetchServiceError.httpError(let actual) = error else {
          +					return XCTFail("Expected HTTP error \(code), got \(result)")
          +				}
          +				XCTAssertEqual(actual, code)
          +			}
          +		}
          +	}
          +
          +	func testHTTPErrorTakesPriorityOverEmptyBody() {
          +		StubURLProtocol.statusCode = 500
          +		StubURLProtocol.body = Data()
          +		fetch { result in
          +			guard case .failure(let error) = result,
          +			      case NBFetchService.NBFetchServiceError.httpError(500) = error else {
          +				return XCTFail("Expected HTTP error, got \(result)")
          +			}
          +		}
          +	}
          +
          +	func testEmptySuccessResponse() {
          +		StubURLProtocol.statusCode = 204
          +		StubURLProtocol.body = Data()
          +		fetch { result in
          +			guard case .failure(let error) = result,
          +			      case NBFetchService.NBFetchServiceError.noData = error else {
          +				return XCTFail("Expected noData, got \(result)")
          +			}
          +		}
          +	}
          +
          +	func testMalformedJSON() {
          +		StubURLProtocol.body = Data("not JSON".utf8)
          +		fetch { result in
          +			guard case .failure(let error) = result,
          +			      case NBFetchService.NBFetchServiceError.parsingError = error else {
          +				return XCTFail("Expected parsing error, got \(result)")
          +			}
          +		}
          +	}
          +
          +	func testTransportError() {
          +		StubURLProtocol.error = URLError(.notConnectedToInternet)
          +		fetch { result in
          +			guard case .failure(let error) = result,
          +			      case NBFetchService.NBFetchServiceError.networkError(let underlying) = error else {
          +				return XCTFail("Expected network error, got \(result)")
          +			}
          +			XCTAssertEqual((underlying as? URLError)?.code, .notConnectedToInternet)
          +		}
          +	}
          +}
          +
          +XCTMain([testCase([
          +	("testSuccess", FetchServiceTests.testSuccess),
          +	("testOtherSuccessfulStatus", FetchServiceTests.testOtherSuccessfulStatus),
          +	("testNonHTTPResponseStillWorks", FetchServiceTests.testNonHTTPResponseStillWorks),
          +	("testHTTPErrorRejectsDecodableBody", FetchServiceTests.testHTTPErrorRejectsDecodableBody),
          +	("testHTTPErrorTakesPriorityOverEmptyBody", FetchServiceTests.testHTTPErrorTakesPriorityOverEmptyBody),
          +	("testEmptySuccessResponse", FetchServiceTests.testEmptySuccessResponse),
          +	("testMalformedJSON", FetchServiceTests.testMalformedJSON),
          +	("testTransportError", FetchServiceTests.testTransportError)
          +])])
          diff --git a/docs/redesign.md b/docs/redesign.md
          new file mode 100644
          index 0000000..1067230
          --- /dev/null
          +++ b/docs/redesign.md
          @@ -0,0 +1,42 @@
          +# Feather interface refresh
          +
          +The library, sources, and settings now share rounded cards, semantic system
          +colors, a subtle accent wash, and rounded dashboard typography. The user's
          +chosen tint and light/dark appearance continue to drive the interface.
          +
          +- Library: live signed/imported counts, a prominent import menu, larger app
          +  icons, separate version and bundle identifier labels, and an inline empty state.
          +- Sources: repository count, a browse-all card, quieter host-only source labels,
          +  and an inline empty state that distinguishes searching from initial setup.
          +- Settings: a matching overview showing the stored certificate count.
          +- Actions: minimum 44-point signing/install pills; expired and revoked states
          +  retain their status colors. At accessibility text sizes, library actions move
          +  beneath the app description.
          +- Navigation: updated SF Symbols while keeping the existing tabs and iPad sidebar.
          +
          +The existing import, sign, install, update, swipe, context-menu, and bulk-selection
          +handlers remain connected to their original actions. New interface text uses
          +the project's localization lookup and falls back to English where untranslated.
          +The existing string catalog has not been edited by hand.
          +
          +## Validation
          +
          +Local checks: `git diff --check`, regression runner shell syntax, workflow YAML,
          +and patch applicability. This Linux workspace has neither Swift nor Xcode;
          +Swift compilation, runtime tests, and rendered iOS verification remain pending.
          +
          +On macOS with the project's supported Xcode and checked-out submodules:
          +
          +```sh
          +bash scripts/test-nimble-json.sh
          +xcodebuild -project Feather.xcodeproj -scheme Feather \
          +  -configuration Debug -destination 'generic/platform=iOS' \
          +  CODE_SIGNING_ALLOWED=NO build
          +```
          +
          +Open `FRDesign.swift` in Xcode for light, dark, and accessibility-size component
          +previews. Before distributing an IPA, check populated and empty libraries,
          +search with no matches, each search scope, long app names, selection/deletion,
          +certificate expiration and revocation, source navigation, and custom accents
          +on both compact iPhone and regular iPad layouts. Component previews are not
          +screenshots of a running Feather build.
          diff --git a/scripts/test-nimble-json.sh b/scripts/test-nimble-json.sh
          new file mode 100644
          index 0000000..0f4ab2b
          --- /dev/null
          +++ b/scripts/test-nimble-json.sh
          @@ -0,0 +1,10 @@
          +#!/usr/bin/env bash
          +set -euo pipefail
          +repo_root="$(cd "$(dirname "$0")/.." && pwd)"
          +test_directory="$(mktemp -d)"
          +trap 'rm -rf "$test_directory"' EXIT
          +xcrun swiftc -swift-version 5 \
          +  "$repo_root/NimbleKit/Sources/NimbleJSON/NBFetchService.swift" \
          +  "$repo_root/NimbleKit/Tests/NimbleJSONRegression/main.swift" \
          +  -o "$test_directory/nimble-json-tests"
          +"$test_directory/nimble-json-tests"
          FEATHER_PATCH

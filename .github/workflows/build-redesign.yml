        with:
          xcode-version: "26.3"
      - name: Build iPhone IPA
        run: make iphoneos
      - uses: actions/upload-artifact@v4
        with:
          name: Feather-redesign-IPA
          path: packages/Feather.ipa
          if-no-files-found: error
